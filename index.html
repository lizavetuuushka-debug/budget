<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#131110">
<title>Тихий бюджет</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
  --bg:#fbf6f0;--card:#ffffff;--ink:#2b2622;--muted:#8d8177;--line:#ece2d8;
  --accent:#b5714f;--accent-soft:#f6e6da;
  --green:#5c9b6e;--yellow:#d3a340;--red:#c06a55;--deposit:#5f7f9e;
  --shadow:0 1px 2px rgba(70,50,35,.06),0 6px 18px rgba(70,50,35,.05);
}
html[data-theme="dark"]{
  --bg:#131110;--card:#1d1a18;--ink:#f1eae2;--muted:#a2958a;--line:#2c2824;
  --accent:#dc9a72;--accent-soft:#2b221c;
  --green:#79b78c;--yellow:#e0b455;--red:#d97f68;--deposit:#8fb0cc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.22);
}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(152px + env(safe-area-inset-bottom));
}
.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:var(--bg);border-bottom:1px solid var(--line);
}
.brand{font-weight:650;font-size:17px;letter-spacing:.2px}
.sp{flex:1}
.iconbtn{
  width:44px;height:44px;border-radius:13px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:18px;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
}
.wrap{max-width:620px;margin:0 auto;padding:0 14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin:12px 0;box-shadow:var(--shadow);
}
h2{font-size:15px;margin:0;font-weight:650}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.big{font-size:30px;font-weight:700;letter-spacing:-.6px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.big.neg{color:var(--red)}
.big.ok{color:var(--green)}
.mini{font-size:13px;color:var(--muted);line-height:1.45}
.mt{margin-top:12px}
.row{display:flex;gap:8px;margin-top:12px}
.row>*{flex:1;min-width:0}
label.f{display:block;margin:11px 0}
label.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.input,select,textarea{
  width:100%;padding:13px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit;
  -webkit-appearance:none;appearance:none;
}
textarea{min-height:64px;resize:vertical}
.input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{
  display:block;width:100%;padding:15px;border-radius:14px;border:0;
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  font-family:inherit;margin-top:12px;cursor:pointer;
}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.sm{padding:12px;font-size:14px;border-radius:12px}
.btn.dep{background:var(--deposit);color:#fff}
.btn:active{opacity:.85}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg-i{
  position:relative;flex:1;min-width:84px;border:1px solid var(--line);border-radius:12px;
  padding:11px 6px;text-align:center;font-size:13px;background:var(--bg);
  color:var(--muted);cursor:pointer;
}
.seg-i input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg-i:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14.5px;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--accent);flex:0 0 auto}
.chk span{flex:1}
.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin:7px 0 5px}
.bar>i{display:block;height:100%;border-radius:6px}
.bar>i.green{background:var(--green)}
.bar>i.yellow{background:var(--yellow)}
.bar>i.red{background:var(--red)}
.limit{margin:13px 0}
.limit:first-of-type{margin-top:4px}
.limit-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.limit-note{font-size:12px;color:var(--muted)}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item-main{flex:1;min-width:0}
.item-t{font-size:15px;word-break:break-word}
.item-s{font-size:12.5px;color:var(--muted);word-break:break-word}
.item-r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.del{
  background:none;border:0;color:var(--muted);font-size:20px;
  padding:0 0 0 10px;line-height:1;cursor:pointer;
}
.dayhead{
  display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
  padding:14px 0 4px;font-weight:600;border-bottom:1px solid var(--line);
}
.tag{
  font-size:11px;background:var(--accent-soft);color:var(--accent);
  padding:2px 7px;border-radius:8px;margin-left:5px;white-space:nowrap;
  display:inline-block;vertical-align:middle;
}
.tag.dep{background:transparent;border:1px solid var(--deposit);color:var(--deposit)}
.pill{
  font-size:11.5px;padding:4px 9px;border-radius:20px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.pill.on{color:var(--green);border-color:var(--green)}
.pill.held{color:var(--green);border-color:var(--green)}
.pill.imp{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:16px 8px;line-height:1.6}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 0}
.mbar .t{font-size:15px;font-weight:600}
.mbar button{
  width:44px;height:44px;border-radius:13px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;padding:0;
}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
}
.nav a{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;
  border-radius:12px;color:var(--muted);text-decoration:none;
  font-size:10.5px;line-height:1.15;text-align:center;
}
.nav a .ic{font-size:17px;line-height:1}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#toast{
  position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;
  pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;
  max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;background:rgba(0,0,0,.45)}
#modal.on{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:620px;margin:0 auto;
  border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;
}
.sheet h3{margin:0 0 6px;font-size:18px}
.chartwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:8px}
.legend{flex:1;min-width:150px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.lg i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.lg em{flex:1;color:var(--muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.note{
  font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:12px;
  padding:11px 12px;margin-top:10px;line-height:1.55;
}
.mile{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mile:last-child{border-bottom:0}
.mile input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:0 0 auto}
.mile .m-main{flex:1;min-width:0;cursor:pointer}
.mile .done{text-decoration:line-through;color:var(--muted)}
.sect{margin:26px 0 0;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
</style>
</head>
<body>

<header class="top">
<div class="brand">Тихий бюджет</div>
<div class="sp"></div>
<button class="iconbtn" data-act="theme" aria-label="Сменить тему">◐</button>
<button class="iconbtn" data-act="go" data-s="settings" aria-label="Настройки">⚙</button>
</header>

<main class="wrap" id="app"></main>

<nav class="nav" id="nav">
<a href="#" data-act="go" data-s="today"><span class="ic">🌿</span>Сегодня</a>
<a href="#" data-act="go" data-s="expenses"><span class="ic">💸</span>Траты</a>
<a href="#" data-act="go" data-s="incomes"><span class="ic">💰</span>Доходы</a>
<a href="#" data-act="go" data-s="fixed"><span class="ic">🏠</span>Оплаты</a>
<a href="#" data-act="go" data-s="orders"><span class="ic">🛍</span>Заказы</a>
<a href="#" data-act="go" data-s="diary"><span class="ic">🧠</span>Дневник</a>
<a href="#" data-act="go" data-s="subs"><span class="ic">🔔</span>Подписки</a>
<a href="#" data-act="go" data-s="reports"><span class="ic">📊</span>Отчёты</a>
</nav>

<div id="toast"></div>
<div id="modal"></div>

<script>
(function(){
'use strict';

/* ============ КОНСТАНТЫ ============ */
var KEY = 'budget_v1';

var CATS = [
  {id:'products', name:'Продукты'},
  {id:'child',    name:'Ребёнок'},
  {id:'home',     name:'Быт'},
  {id:'pets',     name:'Животные'},
  {id:'hobby',    name:'Хобби'},
  {id:'wants',    name:'Хотелки'},
  {id:'medical',  name:'Лечение'},
  {id:'other',    name:'Прочее'}
];
var CATNAME = {};
for (var i = 0; i < iCATS.length; i++) CATNAME[CATS[i].id] = CATS[i].name;

var FUN = ['hobby','wants'];
var PAYS = ['Карта','Кредитка','Наличные'];
var WAITS = [
  {v:'yes', t:'Да, прошла ночь'},
  {v:'no',  t:'Нет'},
  {v:'impulse', t:'Импульсивно'}
];
var EMOTIONS = ['спокойно','тревожно','скучно','уставшая','радостная','наградить себя'];
var SOURCES = ['Пособие','Бабушки','Муж','Самозанятость','Возврат','Другое'];
var STATUSES = ['в корзине','оплачен','в пути','в ПВЗ','отменён','забран'];
var TRIGGERS = ['реклама','скидка','скука','тревога','соцсети','пока есть деньги'];
var COLORS = ['#c9855c','#d3a340','#7ea36b','#c06a55','#8e7cc3','#5f9ea0','#b5714f','#a2968b'];

/* ============ УТИЛИТЫ ============ */
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){
  return Array.prototype.slice.call((root || document).querySelectorAll(sel));
}
function uid(){
  return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    if (c === '&') return '&amp;';
    if (c === '<') return '&lt;';
    if (c === '>') return '&gt;';
    if (c === '"') return '&quot;';
    return '&#39;';
  });
}
function sum(arr){
  var t = 0;
  for (var i = 0; i < iarr.length; i++) t += Number(arr[i]) || 0;
  return t;
}
function sumBy(arr, field){
  var t = 0;
  for (var i = 0; i < iarr.length; i++) t += Number(arr[i][field]) || 0;
  return t;
}
function num(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var s = String(v == null ? '' : v).replace(/\s/g,'').replace(',','.');
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function nf(n){ return new Intl.NumberFormat('ru-RU').format(n); }
function money(v){ return nf(Math.round(num(v))) + ' ₽'; }
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function todayStr(){ return ymd(new Date()); }
function nowLocal(){
  var d = new Date();
  return ymd(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function monthOf(str){
  return String(str == null ? '' : str).slice(0,7);
}
function thisMonth(){ return todayStr().slice(0,7); }

var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function monthLabel(m){
  var p = String(m).split('-');
  if (p.length < 2) return String(m);
  return MONTHS_NOM[Number(p[1]) - 1] + ' ' + p[0];
}
function dateLabel(d){
  var p = String(d).split('-');
  if (p.length < 3) return String(d);
  return Number(p[2]) + ' ' + MONTHS_GEN[Number(p[1]) - 1];
}
function shiftMonth(m, delta){
  var p = String(m).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function addDays(n){
  var d = new Date();
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function daysInMonth(m){
  var p = String(m).split('-');
  return new Date(Number(p[0]), Number(p[1]), 0).getDate();
}
function daysGone(m){
  var t = thisMonth();
  if (m < t) return daysInMonth(m);
  if (m > t) return 0;
  return new Date().getDate();
}

/* ============ ХРАНИЛИЩЕ ============ */
function defaults(){
  return {
    v: 1,
    settings: {
      theme: 'dark',
      funLimit: 3000,
      benefitEnd: '',
      limits: {products:0, child:0, home:0, pets:0, medical:0, other:0}
    },
    expenses: [],
    incomes: [],
    orders: [],
    urges: [],
    subs: [],
    savings: [],
    milestones: [],
    archive: [],
    deposit: {balance: 0},
    fixed: [
      {id:'f_mort', name:'Ипотека', amount:9100, day:15, fromDeposit:true},
      {id:'f_util', name:'Коммуналка', amount:1900, day:10, fromDeposit:false}
    ]
  };
}
function normalize(raw){
  var d = defaults();
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return d;
  var out = {};
  var k;
  for (k in d) if (Object.prototype.hasOwnProperty.call(d, k)) out[k] = d[k];
  for (k in raw) if (Object.prototype.hasOwnProperty.call(raw, k)) out[k] = raw[k];

  var st = raw.settings || {};
  out.settings = {
    theme: st.theme === 'light' ? 'light' : 'dark',
    funLimit: num(st.funLimit) || 3000,
    benefitEnd: typeof st.benefitEnd === 'string' ? st.benefitEnd : '',
    limits: {}
  };
  for (k in d.settings.limits){
    out.settings.limits[k] = num((st.limits || {})[k]) || 0;
  }
  out.deposit = {balance: num((raw.deposit || {}).balance)};
  out.fixed = Array.isArray(raw.fixed) ? raw.fixed : d.fixed;
  if (!out.fixed.length) out.fixed = d.fixed;

  var lists = ['expenses','incomes','orders','urges','subs','savings','milestones','archive'];
  for (var i = 0; i < ilists.length; i++){
    var key = lists[i];
    out[key] = Array.isArray(raw[key]) ? raw[key] : [];
  }

  if (!out.milestones.length){
    out.milestones = [
      {id:uid(), text:'Отменить лишние подписки', date:addDays(7), done:false},
      {id:uid(), text:'Разговор о расходах на ребёнка', date:addDays(30), done:false},
      {id:uid(), text:'Собрать резерв на январь', date:addDays(45), done:false}
    ];
  }
  return out;
}
function loadState(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return normalize(null);
    return normalize(JSON.parse(raw));
  } catch (e) {
    return normalize(null);
  }
}

var state = loadState();
var screen = 'today';
var month = thisMonth();
var toastTimer = null;

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    toast('Не получилось сохранить. Проверьте свободное место в браузере.');
  }
}
function toast(msg){
  var t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2400);
}
function openModal(html){
  var m = $('#modal');
  m.innerHTML = '<div class="sheet">'' + html + '</div>';
  m.classList.add('on');
}
function closeModal(){
  var m = $('#modal');
  m.classList.remove('on');
  m.innerHTML = '';
}
function go(s){
  screen = s;
  window.scrollTo(0, 0);
  render();
}
function bumpMonth(delta){
  month = shiftMonth(month, delta);
  render();
} /* ============ ВЫБОРКИ И ВЫЧИСЛЕНИЯ ============ */
function byMonth(list, field, m){
  var t = String(m);
  return list.filter(function(o){
    return monthOf(o[field]) === t;
  });
}
function monthExpenses(m){ return byMonth(state.expenses, 'date', m); }
function monthIncomes(m){ return byMonth(state.incomes, 'date', m); }
function monthOrders(m){ return byMonth(state.orders, 'date', m); }
function monthUrges(m){ return byMonth(state.urges, 'time', m); }
function monthSavingsManual(m){ return byMonth(state.savings, 'date', m); }

function fixedLive(){
  return sum(state.fixed.filter(function(f){ return !f.fromDeposit; }).map(function(f){ return num(f.amount); }));
}
function fixedDeposit(){
  return sum(state.fixed.filter(function(f){ return !!f.fromDeposit; }).map(function(f){ return num(f.amount); }));
}
function monthSavings(m){
  var manual = sumBy(monthSavingsManual(m), 'amount');
  var cancelled = sum(monthOrders(m)
    .filter(function(o){ return o.status === 'отменён'; })
    .map(function(o){ return num(o.amount); }));
  return manual + cancelled;
}
function monthExpenseTotal(m){
  var e = monthExpenses(m);
  var t = 0;
  for (var i = 0; i < ie.length; i++) t += num(e[i].amount);
  return t;
}
function monthIncomeFact(m){
  var t = 0;
  var list = monthIncomes(m);
  for (var i = 0; i < ilist.length; i++){
    if (list[i].type === 'fact') t += num(list[i].amount);
  }
  return t;
}
function monthIncomePlan(m){
  var t = 0;
  var list = monthIncomes(m);
  for (var i = 0; i < ilist.length; i++){
    if (list[i].type === 'plan') t += num(list[i].amount);
  }
  return t;
}
function catUsed(m, cat){
  var list = monthExpenses(m);
  var t = 0;
  for (var i = 0; i < ilist.length; i++){
    if (list[i].category === cat) t += num(list[i].amount);
  }
  return t;
}
function funUsed(m){
  var list = monthExpenses(m);
  var t = 0;
  for (var i = 0; i < ilist.length; i++){
    if (FUN.indexOf(list[i].category) >= 0) t += num(list[i].amount);
  }
  return t;
}
function limitRows(m){
  var rows = [];
  var i, lim, used, pct;
  for (i = 0; i < iCATS.length; i++){
    if (FUN.indexOf(CATS[i].id) >= 0) continue;
    lim = num(state.settings.limits[CATS[i].id]);
    if (!lim) continue;
    used = catUsed(m, CATS[i].id);
    pct = lim > 0 ? (used / lim) * 100 : 0;
    rows.push({name:CATS[i].name, used:used, lim:lim, pct:pct, fun:false});
  }
  var fl = num(state.settings.funLimit);
  if (fl > 0){
    used = funUsed(m);
    pct = (used / fl) * 100;
    rows.push({name:'Легальные хотелки', used:used, lim:fl, pct:pct, fun:true});
  }
  return rows;
}
function barClass(pct){
  if (pct > 100) return 'red';
  if (pct >= 70) return 'yellow';
  return 'green';
}
function barHtml(pct){
  var w = Math.max(0, Math.min(100, pct));
  return '<div class="bar"><i class="' + barClass(pct) + '" style="width:' + w.toFixed(1) + '%"></i></div>';
}
function limitTone(pct){
  if (pct > 100) return 'Чуть больше плана — это просто цифра, выдох.';
  if (pct >= 70) return 'Близко к границе, запас ещё есть.';
  return 'Спокойно, запас есть.';
}
function impulseShare(m){
  var list = monthExpenses(m);
  if (!list.length) return null;
  var imp = 0;
  for (var i = 0; i < ilist.length; i++){
    if (list[i].wait === 'impulse') imp++;
  }
  return {imp:imp, total:list.length, pct:Math.round(imp / list.length * 100)};
}

/* ============ ДИАГРАММА (SVG) ============ */
function pieSvg(items){
  var total = 0;
  for (var i = 0; i < iitems.length; i++) total += items[i].value;
  if (!total) return '';

  var size = 168, r = 68, cx = size/2, cy = size/2, stroke = 30;
  var circ = 2 * Math.PI * r;
  var offset = 0;
  var h = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">';
  h += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '"></circle>';
  for (var j = 0; j < jitems.length; j++){
    var frac = items[j].value / total;
    var len = circ * frac;
    h += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none"';
    h += ' stroke="' + items[j].color + '" stroke-width="' + stroke + '"';
    h += ' stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '"';
    h += ' stroke-dashoffset="' + (-offset).toFixed(2) + '"';
    h += ' transform="rotate(-90 ' + cx + ' ' + cy + ')" stroke-linecap="butt"></circle>';
    offset += len;
  }
  h += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="13" fill="var(--muted)">всего</text>';
  h += '<text x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)">' + esc(money(total)) + '</text>';
  h += '</svg>';
  return h;
}

function monthIndexAll(){
  var set = {};
  var i;
  for (i = 0; i < state.expenses.length; i++) set[monthOf(state.expenses[i].date)] = true;
  for (i = 0; i < state.incomes.length; i++) set[monthOf(state.incomes[i].date)] = true;
  for (i = 0; i < state.savings.length; i++) set[monthOf(state.savings[i].date)] = true;
  for (i = 0; i < state.orders.length; i++) set[monthOf(state.orders[i].date)] = true;
  set[thisMonth()] = true;
  return set;
}
function forecastBlock(m){
  var day = daysGone(m);
  var dim = daysInMonth(m);
  var spent = monthExpenseTotal(m);
  var avg = day > 0 ? spent / day : 0;
  var rest = Math.max(0, dim - day);
  var projected = spent + avg * rest;
  var incFact = monthIncomeFact(m);
  var fl = fixedLive();
  var balance = incFact - fl - projected;

  var h = '';
  h += '<section class="card">';
  h += '<div class="cardhead"><h2>Прогноз до конца месяца</h2></div>';
  if (!spent){
    h += '<div class="empty">Появится, когда будет хотя бы несколько записей.</div>';
  } else {
    h += '<div class="mini">Средний темп: ' + money(avg) + ' в день.</div>';
    h += '<div class="big' + (balance < 0 ? ' neg' : '') + '">' + money(balance) + '</div>';
    h += '<div class="mini">Если темп сохранится, к концу месяца останется примерно столько.</div>';
    h += '<div class="note">Это ориентир по вашему темпу, а не предсказание. Один крупный платёж меняет картину.</div>';
  }
  h += '</section>';

  var end = state.settings.benefitEnd;
  if (end){
    var nextM = shiftMonth(monthOf(end), 1);
    var incomeAfter = 0;
    var nextInc = byMonth(state.incomes, 'date', nextM);
    for (var i = 0; i < nextInc.length; i++){
      if (nextInc[i].type === 'fact') incomeAfter += num(nextInc[i].amount);
    }
    var planAfter = 0;
    for (var p = 0; p < nextInc.length; p++){
      if (nextInc[p].type === 'plan') planAfter += num(nextInc[p].amount);
    }
    var expected = incomeAfter + planAfter;
    var fixedAll = fixedLive();
    h += '<section class="card">';
    h += '<div class="cardhead"><h2>После окончания пособия</h2><span class="pill">' + esc(monthLabel(nextM)) + '</span></div>';
    h += '<div class="mini">Пособие указано до ' + esc(dateLabel(end)) + '.</div>';
    h += '<div class="kv"><span>Ожидаемые приходы</span><b>' + money(expected) + '</b></div>';
    h += '<div class="kv"><span>Обязательные платежи</span><b>' + money(fixedAll) + '</b></div>';
    if (expected < fixedAll){
      h += '<div class="note">В этом месяце приходы меньше обязательных на <b>' + money(fixedAll - expected) + '</b>. Это стоит обсудить заранее — не в последний день.</div>';
    } else {
      h += '<div class="note">По текущим данным платежи закрываются. Хорошо, что это видно заранее.</div>';
    }
    h += '</section>';
  }
  return h;
}

  },

  saveAdd: function(){
    openModal('<h3>Добавить экономию</h3>' +
      '<label class="f"><span>Сумма</span><input class="input" id="sv-amount" type="number" inputmode="decimal" step="1" min="0" placeholder="0"></label>' +
      '<label class="f"><span>За что (необязательно)</span><input class="input" id="sv-note" type="text" placeholder="отменила подписку, маникюр дома…"></label>' +
      '<div class="row"><button class="btn ghost" data-act="closeModal">Отмена</button>' +
      '<button class="btn" data-act="confirmSaveAdd">Добавить</button></div>');
  },
  confirmSaveAdd: function(el){
    var amount = num(val('sv-amount'));
    if (amount <= 0){ toast('Введите сумму'); return; }
    state.savings.push({id:uid(), date:todayStr(), amount:amount, note:val('sv-note') || ''});
    save(); closeModal(); toast('Экономия записана'); render();
  },

  depositAdd: function(){
    openModal('<h3>Пополнить вклад</h3>' +
      '<div class="mini">Вклад неприкосновенный: он живёт только для ипотеки и подушки.</div>' +
      '<label class="f"><span>Сумма пополнения</span><input class="input" id="dp-amount" type="number" inputmode="decimal" step="100" min="0" placeholder="0"></label>' +
      '<div class="row"><button class="btn ghost" data-act="closeModal">Отмена</button>' +
      '<button class="btn dep" data-act="confirmDepositAdd">Пополнить</button></div>');
  },
  confirmDepositAdd: function(el){
    var amount = num(val('dp-amount'));
    if (amount <= 0){ toast('Введите сумму'); return; }
    state.deposit.balance = num(state.deposit.balance) + amount;
    save(); closeModal(); toast('Вклад пополнен'); render();
  },

  depositPay: function(){
    var fd = fixedDeposit();
    if (!fd){ toast('Платежей со вклада пока нет'); return; }
    openModal('<h3>Списать ипотеку со вклада</h3>' +
      '<div class="mini">Со вклада уйдёт <b>' + money(fd) + '</b> — сумма всех платежей «со вклада». Живые деньги не тронутся.</div>' +
      '<div class="row"><button class="btn ghost" data-act="closeModal">Отмена</button>' +
      '<button class="btn dep" data-act="confirmDepositPay">Списать</button></div>');
  },
  confirmDepositPay: function(el){
    var fd = fixedDeposit();
    state.deposit.balance = num(state.deposit.balance) - fd;
    save(); closeModal(); toast('Списано со вклада'); render();
  },

  saveLimits: function(){
    var inputs = $$('.set-limit');
    for (var i = 0; i < inputs.length; i++){
      var cat = inputs[i].getAttribute('data-cat');
      state.settings.limits[cat] = num(inputs[i].value);
    }
    state.settings.funLimit = num(val('set-fun'));
    save(); toast('Лимиты сохранены'); render();
  },
  saveBenefit: function(){
    state.settings.benefitEnd = val('set-benefit');
    save(); toast('Дата сохранена'); render();
  },
  saveDeposit: function(){
    state.deposit.balance = num(val('set-deposit'));
    save(); toast('Остаток вклада сохранён'); render();
  },

  exportJson: function(){
    download('budget-backup-' + todayStr() + '.json', JSON.stringify(state, null, 2), 'application/json');
    toast('Файл сохраняется — найдите его в «Файлах»');
  },
  importJson: function(){
    var f = document.getElementById('fileJson');
    if (f) f.click();
  },
  exportCsv: function(){
    var rows = [['Дата','Сумма','Категория','Оплата','Маркетплейс','Ночь ожидания','Эмоция','Комментарий']];
    var list = state.expenses.slice().sort(function(a,b){
      return String(a.date).localeCompare(String(b.date));
    });
    for (var i = 0; i < list.length; i++){
      var e = list[i];
      rows.push([
        e.date || '', num(e.amount),
        CATNAME[e.category] || e.category || '',
        e.pay || '',
        e.marketplace ? 'да' : 'нет',
        e.wait || '',
        e.emotion || '',
        e.note || ''
      ]);
    }
    var csv = rows.map(function(r){
      return r.map(function(c){
        return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"';
      }).join(';');
    }).join('\n');
    csv = '\uFEFF' + csv;
    download('traty-' + todayStr() + '.csv', csv, 'text/csv;charset=utf-8');
    toast('CSV готовится — найдите его в «Файлах»');
  },

  archiveMonth: function(){
    openModal('<h3>Заморозить ' + esc(monthLabel(month)) + '?</h3>' +
      '<div class="mini">Итоги месяца сохранятся в архив, записи этого месяца очистятся из рабочих списков. Итоги останутся в отчётах по месяцам.</div>' +
      '<div class="row"><button class="btn ghost" data-act="closeModal">Отмена</button>' +
      '<button class="btn" data-act="confirmArchive">Заморозить</button></div>');
  },
  confirmArchive: function(el){
    state.archive.push({
      month: month,
      spent: monthExpenseTotal(month),
      saved: monthSavings(month),
      archived: nowLocal()
    });
    state.expenses = state.expenses.filter(function(e){ return monthOf(e.date) !== month; });
    state.incomes  = state.incomes.filter(function(x){ return monthOf(x.date) !== month; });
    state.orders   = state.orders.filter(function(o){ return monthOf(o.date) !== month; });
    state.urges    = state.urges.filter(function(u){ return monthOf(u.time) !== month; });
    state.savings  = state.savings.filter(function(s){ return monthOf(s.date) !== month; });
    save(); closeModal(); toast('Месяц заморожен'); render();
  },

  addMile: function(){
    var text = val('ml-text').trim();
    if (!text){ toast('Введите текст точки'); return; }
    state.milestones.push({id:uid(), text:text, date:val('ml-date') || addDays(7), done:false});
    save(); toast('Точка добавлена'); render();
  },
  toggleMile: function(el){
    var id = el.getAttribute('data-id');
    for (var i = 0; i < state.milestones.length; i++){
      if (state.milestones[i].id === id) state.milestones[i].done = !state.milestones[i].done;
    }
    save(); render();
  },
  delMile: function(el){
    var id = el.getAttribute('data-id');
    var next = [];
    for (var i = 0; i < state.milestones.length; i++){
      if (state.milestones[i].id !== id) next.push(state.milestones[i]);
    }
    state.milestones = next;
    save(); toast('Удалено'); render();
  }
};

/* ============ ОБРАБОТЧИКИ И ЗАПУСК ============ */
document.addEventListener('click', function(ev){
  var el = ev.target;
  while (el && el !== document){
    if (el.getAttribute){
      var act = el.getAttribute('data-act');
      if (act && ACT[act]){
        ev.preventDefault();
        ACT[act](el);
        return;
      }
    }
    el = el.parentNode;
  }
});

document.addEventListener('change', function(ev){
  var el = ev.target;
  if (el && el.id === 'fileJson' && el.files && el.files[0]){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(String(reader.result));
        state = normalize(data);
        save();
        toast('Данные загружены');
        document.documentElement.setAttribute('data-theme', state.settings.theme || 'dark');
        render();
      } catch (e){
        toast('Не удалось прочитать файл');
      }
    };
    reader.readAsText(el.files[0]);
  }
});

document.documentElement.setAttribute('data-theme', state.settings.theme || 'dark');
render();

})();
</script>
</body>
</html>
